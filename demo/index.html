<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas | Premium Fake News Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --dark: #0f172a;
            --light: #f8fafc;
            --success: #10b981;
            --error: #ef4444;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 48px;
            overflow: hidden;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 300;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 240px;
            padding: 24px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            transition: all 0.3s ease;
            outline: none;
            color: var(--dark);
            line-height: 1.6;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            background: #1d4ed8;
        }

        button:active { transform: translateY(0); }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #result-container {
            margin-top: 40px;
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            border-radius: 20px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .result-card.real {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1px solid #6ee7b7;
            color: #065f46;
        }

        .result-card.fake {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .real .badge { background: #10b981; color: white; }
        .fake .badge { background: #ef4444; color: white; }

        .result-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 8px 0;
        }

        .confidence-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 16px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            transition: width 1s ease-out;
        }

        .real .progress-fill { background: var(--success); }
        .fake .progress-fill { background: var(--error); }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer-info {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-container { padding: 24px; }
            h1 { font-size: 2rem; }
            .result-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Veritas</h1>
            <p class="subtitle">Advanced Neural Fake News Classification</p>
        </header>

        <div class="input-section">
            <div class="textarea-wrapper">
                <textarea id="newsText" placeholder="Analyze the integrity of a news report. Paste the full text here..."></textarea>
            </div>
            
            <div class="action-bar">
                <span id="charCount" style="color: #94a3b8; font-size: 0.9rem;">0 characters</span>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div id="loader" class="loader"></div>
                    <button id="analyzeBtn" onclick="analyze()">
                        <span>Run Intelligence Scan</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-container">
            <div id="resultCard" class="result-card">
                <div class="badge" id="predictionType">SCAN COMPLETE</div>
                <div class="result-title" id="predictionLabel">REAL NEWS</div>
                <div class="confidence-box">
                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600;">
                        <span>Prediction Confidence</span>
                        <span id="confidencePct">98.5%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill" style="width: 98.5%;"></div>
                    </div>
                    <p style="font-size: 0.8rem; opacity: 0.7;">Based on semantic analysis and linguistic patterns.</p>
                </div>
            </div>
        </div>

        <div class="footer-info">
            Powered by TF-IDF & Logistic Regression • Production Version 1.0.4
        </div>
    </div>

    <script>
        const newsText = document.getElementById('newsText');
        const charCount = document.getElementById('charCount');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const resultCard = document.getElementById('resultCard');
        const predictionLabel = document.getElementById('predictionLabel');
        const confidencePct = document.getElementById('confidencePct');
        const progressFill = document.getElementById('progressFill');

        newsText.addEventListener('input', () => {
            charCount.innerText = `${newsText.value.length} characters`;
        });

        async function analyze() {
            const text = newsText.value.trim();
            if (!text) return alert("Please enter a news article to analyze.");

            // UI State
            analyzeBtn.disabled = true;
            loader.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                // Using 127.0.0.1 for better compatibility on Windows/FastAPI
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error('System error during classification');

                const data = await response.json();
                
                // Update UI based on result
                const isFake = data.prediction.toLowerCase() === 'fake';
                
                resultCard.className = `result-card ${isFake ? 'fake' : 'real'}`;
                predictionLabel.innerText = isFake ? 'POTENTIAL FAKE' : 'LIKELY AUTHENTIC';
                
                const confidence = (data.confidence * 100).toFixed(1);
                confidencePct.innerText = `${confidence}%`;
                
                // Animate progress
                progressFill.style.width = '0%';
                resultContainer.style.display = 'block';
                
                setTimeout(() => {
                    progressFill.style.width = `${confidence}%`;
                }, 100);

            } catch (error) {
                console.error(error);
                alert("The intelligence engine is currently offline. Please ensure the backend is running at http://127.0.0.1:8000");
            } finally {
                analyzeBtn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
