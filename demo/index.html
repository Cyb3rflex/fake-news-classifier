<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Classifier Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; width: 100%; }
        button:hover { background-color: #2980b9; }
        #result { margin-top: 30px; padding: 20px; border-radius: 4px; display: none; }
        .fake { background-color: #e74c3c; color: white; }
        .real { background-color: #2ecc71; color: white; }
        .confidence { font-size: 0.9em; margin-top: 8px; opacity: 0.9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Fake News Classifier</h1>
        <p>Paste a news article text below to check its authenticity.</p>
        <textarea id="newsContent" placeholder="Paste news article content here..."></textarea>
        <button onclick="classifyNews()">Analyze News</button>
        <div id="loader" class="loader"></div>
        <div id="result">
            <h2 id="predictionText"></h2>
            <div class="confidence" id="confidenceText"></div>
        </div>
    </div>

    <script>
        async function classifyNews() {
            const text = document.getElementById('newsContent').value;
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const predText = document.getElementById('predictionText');
            const confText = document.getElementById('confidenceText');

            if (!text.trim()) {
                alert("Please enter some text!");
                return;
            }

            resultDiv.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('http://localhost:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                
                predText.innerText = data.prediction;
                confText.innerText = `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
                
                resultDiv.className = data.prediction === 'Fake' ? 'fake' : 'real';
                resultDiv.style.display = 'block';
            } catch (error) {
                alert("Could not connect to API. Make sure it's running at http://localhost:8000");
                console.error(error);
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
